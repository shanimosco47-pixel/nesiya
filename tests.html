import {
  dedupeAppend, collapseSessionFinals, state as recState, promoteFinalText, pauseRecognition,
  resumeRecognition, stopRecognition, startRecognition, handlers,
  _forTesting
} from './js/recognition.js';

import {
  initStorage, loadSessions, upsertSession, removeSession,
  saveDraft, loadDraft, clearDraft, StorageError
} from './js/storage.js';

const out = document.getElementById('output');
let pass = 0, fail = 0;

function section(title) {
  const el = document.createElement('div');
  el.className = 'section';
  el.textContent = '── ' + title;
  out.appendChild(el);
}

function assert(desc, actual, expected) {
  const ok = actual === expected;
  const el = document.createElement('pre');
  if (ok) {
    el.className = 'pass';
    el.textContent = `✓ ${desc}`;
    pass++;
  } else {
    el.className = 'fail';
    el.textContent = `✗ ${desc}\n  expected: ${JSON.stringify(expected)}\n  got:      ${JSON.stringify(actual)}`;
    fail++;
  }
  out.appendChild(el);
}

function assertTruthy(desc, value) {
  const el = document.createElement('pre');
  if (value) {
    el.className = 'pass';
    el.textContent = `✓ ${desc}`;
    pass++;
  } else {
    el.className = 'fail';
    el.textContent = `✗ ${desc}\n  got: ${JSON.stringify(value)}`;
    fail++;
  }
  out.appendChild(el);
}

function assertFalsy(desc, value) {
  const el = document.createElement('pre');
  if (!value) {
    el.className = 'pass';
    el.textContent = `✓ ${desc}`;
    pass++;
  } else {
    el.className = 'fail';
    el.textContent = `✗ ${desc}\n  expected falsy, got: ${JSON.stringify(value)}`;
    fail++;
  }
  out.appendChild(el);
}

function makeMockSR(onStart) {
  return class {
    constructor() {}
    set lang(_) {} set continuous(_) {} set interimResults(_) {} set maxAlternatives(_) {}
    onresult = null; onerror = null; onend = null;
    start() { onStart?.(); }
    stop() {}
  };
}

// ── dedupeAppend ──────────────────────────────────────────────────────────────
section('dedupeAppend — basic');

assert('empty addition returns existing unchanged',
  dedupeAppend('hello world ', ''), 'hello world ');

assert('empty existing returns trimmed addition with trailing space',
  dedupeAppend('', 'hello world'), 'hello world ');

assert('no overlap: appends with single space separator',
  dedupeAppend('hello ', 'world').trim(), 'hello world');

assert('no shared words: plain append',
  dedupeAppend('alpha beta ', 'gamma delta').trim(),
  'alpha beta gamma delta');

section('dedupeAppend — min-overlap guard (≥3 words required)');

// 1-word overlap must NOT be removed (legitimate repeated name/word)
assert('1-word overlap preserved — מירב appears twice',
  dedupeAppend('צריך לדבר עם מירב ', 'מירב צריכה לשלוח את הדוח').trim(),
  'צריך לדבר עם מירב מירב צריכה לשלוח את הדוח');

// 2-word overlap must NOT be removed
assert('2-word overlap preserved',
  dedupeAppend('שלום עולם ', 'עולם טוב').trim(),
  'שלום עולם עולם טוב');

// 3-word overlap SHOULD be removed (Chrome inter-session replay signal).
// The last 3 words of existing must equal the first 3 words of addition for
// the overlap to be detected (boundary match).
assert('3-word overlap removed (Chrome replay case)',
  dedupeAppend('שלום עולם טוב ', 'שלום עולם טוב בוקר').trim(),
  'שלום עולם טוב בוקר');

// 4-word overlap removed
assert('4-word overlap removed',
  dedupeAppend('one two three four ', 'two three four five').trim(),
  'one two three four five');

// Full replay: many-word overlap
assert('full replay deduped — long Chrome replay',
  dedupeAppend('שלום עולם מה שלומך ', 'שלום עולם מה שלומך הכל טוב').trim(),
  'שלום עולם מה שלומך הכל טוב');

// Repeated identical phrase — full overlap → preserve, no duplication
assert('complete repeat produces no duplication',
  dedupeAppend('אני הולך הביתה עכשיו ', 'אני הולך הביתה עכשיו').trim(),
  'אני הולך הביתה עכשיו');

section('Storage — IndexedDB');

// Clean up any leftover test data from previous run
localStorage.removeItem('nesiya_sessions');

await initStorage();

const S1 = { id: 8888001, date: '2026-01-01', timestamp: '2026-01-01T00:00:00Z', text: 'ראשון' };
const S2 = { id: 8888002, date: '2026-01-02', timestamp: '2026-01-02T00:00:00Z', text: 'שני' };

await upsertSession(S1);
await upsertSession(S2);
const after2 = await loadSessions();
const ids = after2.map(s => s.id);
assertTruthy('two test sessions are saved', ids.includes(8888001) && ids.includes(8888002));

assertTruthy('loadSessions returns newest first', after2[0].id >= after2[1].id);

await upsertSession({ ...S1, text: 'מעודכן' });
const afterUpdate = await loadSessions();
const updated = afterUpdate.find(s => s.id === 8888001);
assert('upsert updates existing session text', updated?.text, 'מעודכן');

await removeSession(8888001);
await removeSession(8888002);
const afterDelete = await loadSessions();
assertTruthy('removeSession deletes both records',
  !afterDelete.find(s => s.id === 8888001) && !afterDelete.find(s => s.id === 8888002));

// ── Draft storage ─────────────────────────────────────────────────────────────
section('Draft storage — basic');

saveDraft({ finalText: 'my draft text', interimText: '' });
assert('saveDraft round-trip — finalText', loadDraft()?.finalText, 'my draft text');
assert('saveDraft round-trip — interimText empty', loadDraft()?.interimText, '');
assert('saveDraft round-trip — legacyCombinedText false', loadDraft()?.legacyCombinedText, false);
clearDraft();
assert('clearDraft — loadDraft returns null', loadDraft(), null);

saveDraft({ finalText: 'another draft', interimText: '' });
saveDraft({ finalText: 'overwritten', interimText: '' });
assert('second saveDraft overwrites first', loadDraft()?.finalText, 'overwritten');
clearDraft();

section('Draft storage — finalText / interimText separation');

saveDraft({ finalText: 'שלום עולם', interimText: 'מה קורה', activeSessionId: 42 });
const dr1 = loadDraft();
assert('finalText preserved', dr1?.finalText, 'שלום עולם');
assert('interimText preserved separately', dr1?.interimText, 'מה קורה');
assert('activeSessionId preserved', dr1?.activeSessionId, 42);
assertTruthy('savedAt is a number', typeof dr1?.savedAt === 'number');
assert('legacyCombinedText false for new format', dr1?.legacyCombinedText, false);
clearDraft();

// Recovery: confirmed-only text — interimText absent from finalText
saveDraft({ finalText: 'confirmed speech', interimText: 'partial unconfirmed', activeSessionId: null });
const drRecovery = loadDraft();
// The two fields must be separate — finalText must NOT contain interimText
assert('recovery — finalText does not contain interimText automatically',
  drRecovery?.finalText, 'confirmed speech');
assert('recovery — interimText available separately',
  drRecovery?.interimText, 'partial unconfirmed');
clearDraft();

// Recovery save without opt-in: using only finalText is safe confirmed text
saveDraft({ finalText: 'confirmed', interimText: 'unconfirmed partial' });
const drSave = loadDraft();
// Simulates btn-recovery-save with checkbox unchecked: use finalText only
const savedTextNoOptIn = drSave.finalText; // checkbox unchecked → finalText only
assert('recovery save (no opt-in) uses finalText only', savedTextNoOptIn, 'confirmed');
// Simulates btn-recovery-save with checkbox checked: include interimText
const savedTextOptIn = (drSave.finalText + ' ' + drSave.interimText).trim();
assert('recovery save (opt-in) includes interimText', savedTextOptIn, 'confirmed unconfirmed partial');
clearDraft();

section('Draft storage — backward compatibility');

// Previous format: { text, activeSessionId, includesInterim: false }
// → confirmed text only, legacyCombinedText: false
localStorage.setItem('nesiya_draft', JSON.stringify({ text: 'prev confirmed', activeSessionId: 7, includesInterim: false, savedAt: 1000 }));
const drPrev1 = loadDraft();
assert('prev format (includesInterim:false) — finalText', drPrev1?.finalText, 'prev confirmed');
assert('prev format (includesInterim:false) — interimText empty', drPrev1?.interimText, '');
assert('prev format (includesInterim:false) — legacyCombinedText false', drPrev1?.legacyCombinedText, false);
assert('prev format (includesInterim:false) — activeSessionId', drPrev1?.activeSessionId, 7);
clearDraft();

// Previous format: { text, activeSessionId, includesInterim: true }
// → combined text, legacyCombinedText: true (can't separate confirmed from interim)
localStorage.setItem('nesiya_draft', JSON.stringify({ text: 'combined text', activeSessionId: null, includesInterim: true, savedAt: 1000 }));
const drPrev2 = loadDraft();
assert('prev format (includesInterim:true) — finalText is combined', drPrev2?.finalText, 'combined text');
assert('prev format (includesInterim:true) — legacyCombinedText true', drPrev2?.legacyCombinedText, true);
clearDraft();

// Oldest format: plain string
localStorage.setItem('nesiya_draft', 'old plain string');
const drPlain = loadDraft();
assert('plain string compat — finalText', drPlain?.finalText, 'old plain string');
assert('plain string compat — interimText empty', drPlain?.interimText, '');
assert('plain string compat — legacyCombinedText true', drPlain?.legacyCombinedText, true);
assert('plain string compat — activeSessionId null', drPlain?.activeSessionId, null);
clearDraft();

section('Draft storage — saveDraft returns bool');

const okResult = saveDraft({ finalText: 'test ok', interimText: '' });
assert('saveDraft returns true on success', okResult, true);

const origDescriptorDraft = Object.getOwnPropertyDescriptor(Storage.prototype, 'setItem');
Object.defineProperty(Storage.prototype, 'setItem', {
  value() { throw new DOMException('QuotaExceededError', 'QuotaExceededError'); },

const failResult = saveDraft({ finalText: 'fail', interimText: '' });

clearDraft();

// ── localStorage migration ────────────────────────────────────────────────────
section('localStorage → IndexedDB migration');

const legacySessions = [
  { id: 7777001, date: '2025-12-01', timestamp: '2025-12-01T00:00:00Z', text: 'legacy one' },
  { id: 7777002, date: '2025-12-02', timestamp: '2025-12-02T00:00:00Z', text: 'legacy two' }
];

// Re-run initStorage to trigger migration

const migrated = await loadSessions();
assertTruthy('both legacy sessions appear after migration',

assert('legacy key removed from localStorage after migration',

await removeSession(7777001);
await removeSession(7777002);

// ── Session continuation (upsert same ID) ─────────────────────────────────────
section('Session continuation — upsert updates, never duplicates');

const CONT = { id: 5555001, date: '2026-03-01', timestamp: '2026-03-01T00:00:00Z', text: 'הטקסט המקורי' };
await upsertSession(CONT);

// Simulate "continue recording" by upserting with the same id
await upsertSession({ ...CONT, text: 'הטקסט המקורי המשך' });
const contAll = await loadSessions();
const contMatches = contAll.filter(s => s.id === 5555001);
assert('no duplicate created by continuation upsert', contMatches.length, 1);
assert('continuation updates text in place', contMatches[0]?.text, 'הטקסט המקורי המשך');

// Upsert a third time to confirm idempotency
await upsertSession({ ...CONT, text: 'גרסה שלישית' });
const contAll2 = await loadSessions();
assert('third upsert still no duplicate', contAll2.filter(s => s.id === 5555001).length, 1);
assert('third upsert updates text again', contAll2.find(s => s.id === 5555001)?.text, 'גרסה שלישית');

await removeSession(5555001);

// ── Draft activeSessionId recovery flow ───────────────────────────────────────
section('Draft recovery — activeSessionId preserved');

// Simulate: user was continuing session 5544001, app crashed, draft was saved
// with activeSessionId.  On recovery, "שמור כהקלטה" must upsert, not create new.
const REC_ID = 5544001;
const recBase = { id: REC_ID, date: '2026-04-01', timestamp: '2026-04-01T00:00:00Z', text: 'טקסט ראשוני' };
await upsertSession(recBase);

// Draft saved mid-recording: confirmed text + interim, with activeSessionId set
saveDraft({ finalText: 'טקסט ראשוני עם תוספות', interimText: 'מילים חלקיות', activeSessionId: REC_ID });
const recDraft = loadDraft();
assert('recovery draft — activeSessionId round-trips', recDraft?.activeSessionId, REC_ID);
assert('recovery draft — finalText round-trips', recDraft?.finalText, 'טקסט ראשוני עם תוספות');
assert('recovery draft — interimText round-trips', recDraft?.interimText, 'מילים חלקיות');
assert('recovery draft — legacyCombinedText false', recDraft?.legacyCombinedText, false);

// Simulate btn-recovery-save with checkbox unchecked: use finalText only (no interim).
// Mirrors the _recoveryText() helper in app.js when recoveryInclude.checked = false.
let recoveryActiveId = recDraft.activeSessionId || null;
const recSessions = await loadSessions();
if (recoveryActiveId) {
  const existing = recSessions.find(s => s.id === recoveryActiveId);
  if (existing) {
    existing.text = recDraft.finalText; // finalText only, interim excluded
    await upsertSession(existing);
  }
}
clearDraft();

const afterRecovery = await loadSessions();
const recMatches = afterRecovery.filter(s => s.id === REC_ID);
assert('recovery save — no duplicate created', recMatches.length, 1);
assert('recovery save — only finalText persisted (interim excluded)', recMatches[0]?.text, 'טקסט ראשוני עם תוספות');
assert('draft cleared after recovery save', loadDraft(), null);

await removeSession(REC_ID);

// ── Legacy draft opt-in guard ─────────────────────────────────────────────────
section('Legacy draft recovery — explicit opt-in required');

// Simulate the _guardLegacy logic from app.js without a real DOM.
// The guard returns false (block action) when legacyCombinedText is true and
// the checkbox is unchecked, and true (allow action) when checked.
function simulateGuard(draft, checkboxChecked) {
  if (!draft.legacyCombinedText) return true;
  return checkboxChecked;
}

// Previous format { text, includesInterim: true } → legacyCombinedText: true
localStorage.setItem('nesiya_draft', JSON.stringify({
  text: 'combined text with interim', activeSessionId: null, includesInterim: true, savedAt: 1000
}));
const legDraft1 = loadDraft();
assert('prev includesInterim:true — legacyCombinedText', legDraft1?.legacyCombinedText, true);
assert('guard blocks without opt-in (includesInterim:true)', simulateGuard(legDraft1, false), false);
assert('guard allows with opt-in (includesInterim:true)', simulateGuard(legDraft1, true), true);
// With opt-in, full combined text is used
assert('opt-in text = combined finalText', legDraft1?.finalText, 'combined text with interim');
clearDraft();

// Plain string legacy draft → legacyCombinedText: true
localStorage.setItem('nesiya_draft', 'plain string draft');
const legDraft2 = loadDraft();
assert('plain string — legacyCombinedText', legDraft2?.legacyCombinedText, true);
assert('guard blocks without opt-in (plain string)', simulateGuard(legDraft2, false), false);
assert('guard allows with opt-in (plain string)', simulateGuard(legDraft2, true), true);
clearDraft();

// Without opt-in, no session must be persisted (guard returns false → caller skips persistCurrentSession)
const LEGACY_ID = 4433001;
const legacyBase = { id: LEGACY_ID, date: '2026-05-01', timestamp: '2026-05-01T00:00:00Z', text: 'base' };
await upsertSession(legacyBase);
localStorage.setItem('nesiya_draft', 'plain string draft that should not auto-save');
const legDraftNoOptIn = loadDraft();
const wouldProceed = simulateGuard(legDraftNoOptIn, false); // checkbox unchecked
if (!wouldProceed) {
  // Guard blocked — no upsert performed, session unchanged
}
const sessionAfterBlock = (await loadSessions()).find(s => s.id === LEGACY_ID);
assert('no session update when guard blocks', sessionAfterBlock?.text, 'base');

// With opt-in, upsert is performed
const wouldProceedOptIn = simulateGuard(legDraftNoOptIn, true);
if (wouldProceedOptIn) {
  await upsertSession({ ...legacyBase, text: legDraftNoOptIn.finalText });
}
const sessionAfterOptIn = (await loadSessions()).find(s => s.id === LEGACY_ID);
assert('session updated after opt-in', sessionAfterOptIn?.text, 'plain string draft that should not auto-save');
clearDraft();
await removeSession(LEGACY_ID);

// ── Screen-off regression — promoteFinalText ──────────────────────────────────
section('Screen-off regression — promoteFinalText');

// Normal case: trailing space normalisation
promoteFinalText('שלום עולם מה שלומך');
assert('promoteFinalText sets finalText with trailing space',
  recState.finalText, 'שלום עולם מה שלומך ');

// Empty string: cleared, not set to ' '
promoteFinalText('');
assert('promoteFinalText empty text → empty string', recState.finalText, '');

// Whitespace-only: treated as empty
promoteFinalText('   ');
assert('promoteFinalText whitespace-only → empty string', recState.finalText, '');

// Leading/trailing whitespace trimmed, trailing space added
promoteFinalText('  trimmed text  ');
assert('promoteFinalText trims edges, adds trailing space', recState.finalText, 'trimmed text ');

// pauseRecognition must not clear finalText (_rec is null in test env → stop() is no-op)
recState.isRecording = true;
recState.isPaused = false;
recState.finalText = 'important transcript data ';
pauseRecognition();
assert('pauseRecognition preserves finalText', recState.finalText, 'important transcript data ');
assert('pauseRecognition sets isPaused', recState.isPaused, true);
// Reset state so remaining tests start clean
recState.isRecording = false; recState.isPaused = false; recState.finalText = '';

// After promote (which includes interim), dedupeAppend handles the next Chrome replay
promoteFinalText('שלום עולם מה');  // textarea showed finalised "שלום עולם" + interim "מה"
assert('post-promote: 3-word boundary replay is deduped after resume',
  dedupeAppend(recState.finalText, 'שלום עולם מה הכל טוב').trim(),
  'שלום עולם מה הכל טוב');

// Full-sentence replay after promote — complete overlap still deduped
promoteFinalText('אני הולך הביתה עכשיו');
assert('post-promote: complete replay deduped',
  dedupeAppend(recState.finalText, 'אני הולך הביתה עכשיו').trim(),
  'אני הולך הביתה עכשיו');

// ── Screen-off draft save — immediate persist ─────────────────────────────────
section('Screen-off draft save — immediate persist');

// Simulates the immediate saveDraft call in visibilitychange 'hidden':
// finalText = full visible transcript (promoted from textarea, interim included)
// interimText = '' (the field is cleared because we promoted interim into finalText)
saveDraft({ finalText: 'שלום עולם מה', interimText: '' });
const bgDraft = loadDraft();
assert('screen-off draft: finalText = full visible text', bgDraft?.finalText, 'שלום עולם מה');
assert('screen-off draft: interimText cleared (promoted into finalText)', bgDraft?.interimText, '');
assert('screen-off draft: legacyCombinedText = false', bgDraft?.legacyCombinedText, false);
clearDraft();

// If Android reloads the page after backgrounding, the recovery modal must
// show the full pre-lock transcript (not just the finalised portion).
saveDraft({ finalText: 'הטקסט המלא מלפני נעילת המסך', interimText: '', activeSessionId: 9900 });
const reloadDraft = loadDraft();
assert('post-reload draft: full transcript preserved', reloadDraft?.finalText, 'הטקסט המלא מלפני נעילת המסך');
assert('post-reload draft: activeSessionId preserved', reloadDraft?.activeSessionId, 9900);
clearDraft();

// ── collapseSessionFinals — overlap-aware final collapsing ────────────────────
section('collapseSessionFinals — Chrome Android expansion collapsing');

function makeResults(arr) {
  // Returns a minimal SpeechRecognitionResultList-alike (indexable, has .length)
  const list = arr.map(([transcript, isFinal]) => {
    const alt = { transcript }; alt[0] = alt;
    return Object.assign([alt], { isFinal, 0: alt, length: 1 });
  });
  list.length = arr.length;
  return list;
}

// 1. Expanding finals — the device-confirmed bug pattern
{
  const r = makeResults([
    ['אני', true],
    ['אני', true],
    ['אני עושה', true],
    ['אני עושה ניסיון', true],
    ['אני עושה ניסיון ואני', true],
    ['אני עושה ניסיון ואני רוצה', true],
  ]);
  assert('expanding finals collapse to longest version',
    collapseSessionFinals(r).trim(), 'אני עושה ניסיון ואני רוצה');
}

// 2. Distinct non-overlapping segments are appended normally
{
  const r = makeResults([
    ['שלום עולם', true],
    ['מה שלומך', true],
  ]);
  assert('distinct segments append normally',
    collapseSessionFinals(r).trim(), 'שלום עולם מה שלומך');
}

// 3. Subset result after a longer result is discarded
{
  const r = makeResults([
    ['אני עושה ניסיון', true],
    ['אני עושה', true],   // shorter — already superseded
  ]);
  assert('subset result is discarded, longer kept',
    collapseSessionFinals(r).trim(), 'אני עושה ניסיון');
}

// 4. ≥3-word boundary overlap between distinct segments is de-duped
{
  const r = makeResults([
    ['שלום עולם טוב', true],
    ['עולם טוב מאוד', true],   // 2-word overlap "עולם טוב" < MIN → no dedup
  ]);
  // 2-word overlap is below MIN_OVERLAP_WORDS=3 → treated as new distinct segment
  assert('2-word boundary overlap preserved (below MIN_OVERLAP_WORDS)',
    collapseSessionFinals(r).trim(), 'שלום עולם טוב עולם טוב מאוד');
}

{
  const r = makeResults([
    ['שלום עולם טוב מאוד', true],
    ['עולם טוב מאוד גדול', true],   // 3-word overlap → de-duped
  ]);
  assert('3-word boundary overlap is de-duped',
    collapseSessionFinals(r).trim(), 'שלום עולם טוב מאוד גדול');
}

// 5. Empty results list returns empty string
{
  const r = makeResults([]);
  assert('empty results list returns empty string', collapseSessionFinals(r).trim(), '');
}

// 6. Non-final results are ignored
{
  const r = makeResults([
    ['interim only', false],
  ]);
  assert('non-final results are ignored', collapseSessionFinals(r).trim(), '');
}

// 7. Legitimate repeated word (מירב...מירב) is not collapsed
{
  const r = makeResults([
    ['דיברתי עם מירב', true],
    ['מירב אמרה שכן', true],
  ]);
  // 1-word overlap "מירב" < MIN_OVERLAP_WORDS=3 → both appear
  assert('single-word repeated name is preserved (below MIN_OVERLAP_WORDS)',
    collapseSessionFinals(r).trim(), 'דיברתי עם מירב מירב אמרה שכן');
}

// 8. Expansion followed by a new distinct segment
{
  const r = makeResults([
    ['אני', true],
    ['אני עושה', true],
    ['אני עושה ניסיון', true],
    ['עכשיו', true],            // genuinely new segment after expansion
  ]);
  assert('expansion then distinct segment: both appear correctly',
    collapseSessionFinals(r).trim(), 'אני עושה ניסיון עכשיו');
}

// ── collapseSessionFinals — punctuation pass-through ─────────────────────────
// Note: punctuation is handled in _trailingPunct (called from onresult),
// not inside collapseSessionFinals itself. collapseSessionFinals skips
// punctuation-only slots (tNorm === '' after _norm). These tests verify
// that word content is unaffected when punctuation slots are present.
section('collapseSessionFinals — punctuation slots ignored in word collapse');

// Punctuation-only slots are skipped; word expansion works normally.
{
  const r = makeResults([
    ['שלום', true],
    ['שלום עולם', true],
    ['.', true],              // period slot — must not disrupt expansion dedup
  ]);
  assert('punctuation slot does not corrupt word expansion',
    collapseSessionFinals(r).trim(), 'שלום עולם');
}

// Duplicate period slots: collapseSessionFinals returns only word content.
{
  const r = makeResults([
    ['יש', true],
    ['יש הרבה', true],
    ['.', true],
    ['.', true],
  ]);
  assert('duplicate period slots — word content only in collapseSessionFinals',
    collapseSessionFinals(r).trim(), 'יש הרבה');
}

// Empty-string slots (invisible Unicode noise) are ignored.
{
  const r = makeResults([
    ['', true],
    ['', true],
    ['יש', true],
    ['יש הרבה', true],
  ]);
  assert('empty slots before words are ignored',
    collapseSessionFinals(r).trim(), 'יש הרבה');
}

// Newline-only slots are skipped (trimmed to '' → filtered).
{
  const r = makeResults([
    ['\n', true],
    ['\n', true],
  ]);
  assert('newline-only session → empty collapsed', collapseSessionFinals(r).trim(), '');
}

// ── VAD async race conditions ──────────────────────────────────────────────────
section('VAD async race conditions');

// Test 1 — init pending → resume → SR only starts AFTER getUserMedia settles
{
  _forTesting.reset();
  recState.isRecording = true; recState.isPaused = true;
  let resolveGUM, trackStopped = false, gumResolved = false, srStartedAfterGUM = false, srStartCalled = false;
  _forTesting.setGetUserMedia(() => new Promise(r => resolveGUM = r));
  _forTesting.setSR(makeMockSR(() => { srStartedAfterGUM = gumResolved; srStartCalled = true; }));
  const initP1 = _forTesting.ensureVADInitialized();
  const resumeP1 = resumeRecognition();
  assertFalsy('T1: SR not called while GUM is pending', srStartCalled);
  gumResolved = true;
  resolveGUM({ getTracks: () => [{ stop() { trackStopped = true; } }] });
  await Promise.all([initP1, resumeP1]);
  assertTruthy('T1: local stream track stopped after init aborted', trackStopped);
  assertFalsy('T1: no global vadStream leaked', _forTesting.getInternalState().vadStream);
  assertTruthy('T1: SR.start was called exactly once', srStartCalled);
  assertTruthy('T1: SR started only after GUM resolved', srStartedAfterGUM);
  _forTesting.clearGetUserMedia(); _forTesting.clearSR();
}

// Test 2 — init pending → Stop → local stream released, no restart
{
  _forTesting.reset();
  recState.isRecording = true; recState.isPaused = true;
  let resolveGUM2, trackStopped2 = false, startCalled2 = false;
  _forTesting.setGetUserMedia(() => new Promise(r => resolveGUM2 = r));
  _forTesting.setSR(makeMockSR(() => startCalled2 = true));
  clearDiagLog();
  const initP2 = _forTesting.ensureVADInitialized();
  stopRecognition();
  resolveGUM2({ getTracks: () => [{ stop() { trackStopped2 = true; } }] });
  await initP2;
  assertFalsy('T2: no global vadStream after stop+resolve', _forTesting.getInternalState().vadStream);
  assertTruthy('T2: local stream track stopped', trackStopped2);
  assertFalsy('T2: SR.start not called', startCalled2);
  assertTruthy('T2: vad_init_superseded logged', getDiagLog().some(e => e.type === 'vad_init_superseded'));
  assertFalsy('T2: restart_exec not logged', getDiagLog().some(e => e.type === 'restart_exec'));
  _forTesting.clearGetUserMedia(); _forTesting.clearSR();
}

// Test 3 — Stop during async VAD release → _restart() not called
{
  _forTesting.reset();
  recState.isRecording = true; recState.isPaused = true;
  let resolveClose3, startCalled3 = false;
  // Shared promise: all calls to close() return the same promise so resolveClose3 is not clobbered
  // if stopRecognition()'s _releaseVAD() also calls close() while the first await is pending.
  const closeP3 = new Promise(r => resolveClose3 = r);
  const mockCtx3 = { state: 'running', close: () => closeP3 };
  const mockStream3 = { getTracks: () => [{ stop() {} }] };
  _forTesting.setVADResources(mockStream3, mockCtx3, null);
  _forTesting.setSR(makeMockSR(() => startCalled3 = true));
  clearDiagLog();
  const resumeP3 = resumeRecognition();
  stopRecognition();
  resolveClose3();
  const result3 = await resumeP3;
  assert('T3: resumeRecognition returns false when stopped during release', result3, false);
  assertFalsy('T3: SR.start not called', startCalled3);
  assertTruthy('T3: resume_aborted logged', getDiagLog().some(e => e.type === 'resume_aborted'));
  _forTesting.clearSR();
}

// Test 4 — Duplicate resume → exactly one SR start, _resumePending cleared
{
  _forTesting.reset();
  recState.isRecording = true; recState.isPaused = true;
  let startCalled4 = 0;
  _forTesting.setSR(makeMockSR(() => startCalled4++));
  const [r4a, r4b] = await Promise.all([resumeRecognition(), resumeRecognition()]);
  assert('T4: exactly one resume succeeded', [r4a, r4b].filter(Boolean).length, 1);
  assert('T4: SR.start called exactly once', startCalled4, 1);
  assertFalsy('T4: _resumePending cleared after resume', _forTesting.getInternalState().resumePending);
  _forTesting.clearSR();
}

// Test 5 — Concurrent VAD init same generation → getUserMedia called once
{
  _forTesting.reset();
  recState.isRecording = true; recState.isPaused = true;
  let gumCalls5 = 0, resolveGUM5;
  const mockTrack5 = { stop() {} };
  const mockStream5 = { getTracks: () => [mockTrack5] };
  _forTesting.setGetUserMedia(() => { gumCalls5++; return new Promise(r => resolveGUM5 = r); });
  const p5a = _forTesting.ensureVADInitialized();
  const p5b = _forTesting.ensureVADInitialized();
  assert('T5: same promise returned (single-flight)', p5a === p5b, true);
  resolveGUM5(mockStream5);
  await Promise.all([p5a, p5b]);
  assert('T5: getUserMedia called only once', gumCalls5, 1);
  _forTesting.clearGetUserMedia();
}

// Test 6 — Old init invalidated by resume → new VAD cycle starts a fresh init
{
  _forTesting.reset();
  recState.isRecording = true; recState.isPaused = true;
  let gumCalls6 = 0, resolveGUM6;
  _forTesting.setGetUserMedia(() => { gumCalls6++; return new Promise(r => resolveGUM6 = r); });
  const initP6a = _forTesting.ensureVADInitialized();
  assert('T6: getUserMedia called once on first init', gumCalls6, 1);
  resumeRecognition();  // increments gen; will await initP6a
  resolveGUM6({ getTracks: () => [{ stop() {} }] });
  await initP6a;

  _forTesting.reset();
  recState.isRecording = true; recState.isPaused = true;
  _forTesting.setGetUserMedia(() => { gumCalls6++; return new Promise(r => resolveGUM6 = r); });
  const initP6b = _forTesting.ensureVADInitialized();
  assert('T6: fresh promise created after reset (different from initP6a)', initP6a !== initP6b, true);
  resolveGUM6({ getTracks: () => [{ stop() {} }] });
  await initP6b;
  assert('T6: getUserMedia called again for fresh init', gumCalls6, 2);
  _forTesting.clearGetUserMedia();
}

// Test 7 — Stop → New Recording while old VAD init pending → SR waits for old GUM
{
  _forTesting.reset();
  recState.isRecording = true; recState.isPaused = true;
  let resolveGUM7, gumResolved7 = false, trackStopped7 = false, srStartedAfterGUM7 = false, startCalled7 = false;
  _forTesting.setGetUserMedia(() => new Promise(r => resolveGUM7 = r));
  _forTesting.setSR(makeMockSR(() => { srStartedAfterGUM7 = gumResolved7; startCalled7 = true; }));
  const initP7 = _forTesting.ensureVADInitialized();
  stopRecognition();  // gen++; old init will abort on GUM resolve
  // DO NOT call _forTesting.reset() — keep _vadInitPromise live so startRecognition waits
  const startP7 = startRecognition('');  // gen++; must await old _vadInitPromise
  assertFalsy('T7: SR not started while old GUM is pending', startCalled7);
  gumResolved7 = true;
  resolveGUM7({ getTracks: () => [{ stop() { trackStopped7 = true; } }] });
  await Promise.all([initP7, startP7]);
  assertTruthy('T7: stale local stream track stopped', trackStopped7);
  assertTruthy('T7: new SR started after old GUM resolved', startCalled7);
  assertTruthy('T7: SR started only after GUM resolved', srStartedAfterGUM7);
  _forTesting.clearGetUserMedia(); _forTesting.clearSR();
}

// Test 8 — VAD init never resolves → timeout → SR blocked
{
  _forTesting.reset();
  recState.isRecording = true; recState.isPaused = true;
  _forTesting.setGetUserMedia(() => new Promise(() => {}));  // never resolves
  _forTesting.setVADInitTimeoutMs(50);
  let startCalled8 = false, timeoutFired8 = false;
  _forTesting.setSR(makeMockSR(() => startCalled8 = true));
  handlers.onVADInitTimeout = () => { timeoutFired8 = true; };
  clearDiagLog();
  const initP8 = _forTesting.ensureVADInitialized();
  const resumeP8 = resumeRecognition();
  const result8 = await resumeP8;
  assert('T8: resumeRecognition returns false on timeout', result8, false);
  assertFalsy('T8: SR.start not called on timeout', startCalled8);
  assertTruthy('T8: onVADInitTimeout fired', timeoutFired8);
  assertTruthy('T8: vad_init_timeout logged', getDiagLog().some(e => e.type === 'vad_init_timeout'));
  handlers.onVADInitTimeout = null;
  _forTesting.clearGetUserMedia(); _forTesting.clearSR(); _forTesting.resetVADInitTimeoutMs();
}

summary.textContent = `${pass} passed, ${fail} failed`;
summary.style.color = fail ? '#f74f4f' : '#4ff7a0';
