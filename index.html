<!DOCTYPE html>
<html lang="he" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>נסיעה</title>

    <link rel="manifest" href='data:application/manifest+json,{"name":"נסיעה","short_name":"נסיעה","start_url":"./index.html","display":"standalone","background_color":"#0a0a0f","theme_color":"#0a0a0f","orientation":"portrait","icons":[{"src":"data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232563eb%22/><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>","sizes":"512x512","type":"image/svg+xml"}]}'>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { display: none; }
        .modal.active { display: flex !important; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-[#0a0a0f] text-white p-4 h-screen flex flex-col justify-between select-none">

    <div id="toast" class="fixed bottom-28 left-1/2 transform -translate-x-1/2 bg-gray-800 border border-gray-700 text-white px-4 py-2.5 rounded-2xl text-xs shadow-xl transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2"></div>

    <header class="flex justify-between items-center py-2">
        <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
            <h1 class="text-lg font-bold tracking-tight">נסיעה v7.0</h1>
        </div>
        <div class="flex gap-2">
            <button id="btn-history" class="text-xs bg-gray-800 hover:bg-gray-700 active:scale-95 transition-all px-4 py-1.5 rounded-full font-medium">היסטוריה</button>
        </div>
    </header>

    <div class="flex-1 flex flex-col my-2 gap-2">
        <div class="flex justify-between items-center">
            <span class="text-xs text-gray-400 font-medium">תמליל פעיל</span>
            <div class="flex gap-2">
                <button id="btn-new" class="text-xs bg-blue-900/30 text-blue-300 hover:bg-blue-900/50 active:scale-95 transition-all px-3 py-1 rounded-xl font-bold">שיחה חדשה</button>
                <button id="btn-copy" class="text-xs bg-gray-800 text-gray-300 hover:bg-gray-700 active:scale-95 transition-all px-3 py-1 rounded-xl font-bold">העתק טקסט</button>
            </div>
        </div>

        <textarea id="output" class="flex-1 w-full bg-gray-900/50 border border-gray-800/80 p-4 rounded-2xl text-lg outline-none resize-none focus:border-blue-500 transition-all leading-relaxed" placeholder="התמלול יופיע כאן בזמן אמת..."></textarea>

        <div id="debug-log" class="text-[10px] text-gray-500 bg-black/40 p-3 rounded-xl h-16 overflow-y-auto font-mono border border-gray-900">
            מערכת מוכנה לעבודה.
        </div>
    </div>

    <footer class="flex flex-col gap-3 pb-2">
        <button id="record-btn" class="w-full py-6 bg-blue-600 active:scale-[0.98] transition-all rounded-2xl font-bold text-xl shadow-lg shadow-blue-900/20 flex items-center justify-center gap-2">
            <span id="record-icon" class="w-3 h-3 rounded-full bg-white"></span>
            <span id="record-text">התחל הקלטה</span>
        </button>
        <div id="status" class="text-center text-gray-400 text-xs font-medium h-4">מוכן</div>
    </footer>

    <!-- History Modal -->
    <div id="history-modal" class="modal fixed inset-0 bg-black/95 z-50 items-center justify-center p-4">
        <div class="bg-gray-800 p-6 rounded-2xl w-full max-w-lg border border-gray-700 flex flex-col h-[80vh]">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold">היסטוריית הקלטות</h2>
                <button id="btn-close-history" class="text-xs bg-gray-700 px-4 py-1.5 rounded-full font-medium active:scale-95 transition-all">סגור</button>
            </div>
            <div id="history-list" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>
        </div>
    </div>

    <script>
        const INJECTED_API_KEY = '%%OPENAI_API_KEY%%';

        window.onload = () => {
            const logEl = document.getElementById('debug-log');
            const toastEl = document.getElementById('toast');

            const log = (msg) => {
                logEl.innerHTML += `<br>> ${msg}`;
                logEl.scrollTop = logEl.scrollHeight;
            };

            const showToast = (msg) => {
                toastEl.textContent = msg;
                toastEl.className = "fixed bottom-28 left-1/2 transform -translate-x-1/2 bg-gray-800 border border-gray-700 text-white px-4 py-2.5 rounded-2xl text-xs shadow-xl transition-all duration-300 opacity-100 z-50 flex items-center gap-2";
                setTimeout(() => {
                    toastEl.className = "fixed bottom-28 left-1/2 transform -translate-x-1/2 bg-gray-800 border border-gray-700 text-white px-4 py-2.5 rounded-2xl text-xs shadow-xl transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2";
                }, 2500);
            };

            const getApiKey = () => {
                if (INJECTED_API_KEY && !INJECTED_API_KEY.includes('%%')) return INJECTED_API_KEY;
                return localStorage.getItem('OPENAI_API_KEY');
            };

            const getHistory = () => {
                try { return JSON.parse(localStorage.getItem('nesiya_history')) || []; }
                catch (e) { return []; }
            };

            const saveHistory = (history) => localStorage.setItem('nesiya_history', JSON.stringify(history));

            const saveCurrentToHistory = (silent = false) => {
                const text = output.value.trim();
                if (!text) return null;
                const history = getHistory();
                const currentId = localStorage.getItem('nesiya_current_id');
                if (currentId) {
                    const index = history.findIndex(item => item.id === currentId);
                    if (index !== -1) {
                        history[index].text = text;
                        history[index].timestamp = new Date().toLocaleString('he-IL');
                        saveHistory(history);
                        if (!silent) showToast("השיחה עודכנה בהיסטוריה");
                        return currentId;
                    }
                }
                const newId = 'session_' + Date.now();
                history.unshift({ id: newId, timestamp: new Date().toLocaleString('he-IL'), text });
                saveHistory(history);
                localStorage.setItem('nesiya_current_id', newId);
                if (!silent) showToast("שיחה נשמרה בהיסטוריה");
                return newId;
            };

            const renderHistory = () => {
                const history = getHistory();
                const listEl = document.getElementById('history-list');
                listEl.innerHTML = '';
                if (history.length === 0) {
                    listEl.innerHTML = '<div class="text-center text-gray-500 py-8 text-sm">אין הקלטות שמורות.</div>';
                    return;
                }
                history.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "bg-gray-900/60 border border-gray-800 p-4 rounded-xl flex flex-col gap-2";
                    const snippet = item.text.length > 100 ? item.text.substring(0, 100) + '...' : item.text;
                    card.innerHTML = `
                        <div class="flex justify-between items-center border-b border-gray-800/50 pb-2">
                            <span class="text-xs text-blue-400 font-mono font-bold">${item.timestamp}</span>
                            <button class="delete-btn text-xs text-red-400 bg-red-950/20 hover:bg-red-950/50 px-2 py-1 rounded-lg" data-id="${item.id}">מחק</button>
                        </div>
                        <p class="text-sm text-gray-300 leading-relaxed break-words">${snippet}</p>
                        <div class="flex justify-end mt-1">
                            <button class="load-btn text-xs bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg font-bold" data-id="${item.id}">טען והמשך</button>
                        </div>`;
                    listEl.appendChild(card);
                });
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.onclick = (e) => {
                        const id = e.target.getAttribute('data-id');
                        saveHistory(getHistory().filter(item => item.id !== id));
                        if (localStorage.getItem('nesiya_current_id') === id) localStorage.removeItem('nesiya_current_id');
                        renderHistory();
                        showToast("הקלטה נמחקה");
                    };
                });
                document.querySelectorAll('.load-btn').forEach(btn => {
                    btn.onclick = (e) => {
                        const id = e.target.getAttribute('data-id');
                        saveCurrentToHistory(true);
                        const item = getHistory().find(item => item.id === id);
                        if (item) {
                            output.value = item.text;
                            localStorage.setItem('nesiya_draft', item.text);
                            localStorage.setItem('nesiya_current_id', item.id);
                            document.getElementById('history-modal').classList.remove('active');
                            showToast("שיחה נטענה מחדש");
                        }
                    };
                });
            };

            const historyModal = document.getElementById('history-modal');
            const status = document.getElementById('status');

            const savedDraft = localStorage.getItem('nesiya_draft');
            if (savedDraft) document.getElementById('output').value = savedDraft;

            document.getElementById('btn-history').onclick = () => { renderHistory(); historyModal.classList.add('active'); };
            document.getElementById('btn-close-history').onclick = () => historyModal.classList.remove('active');

            document.getElementById('btn-copy').onclick = () => {
                const text = output.value.trim();
                if (!text) { showToast("אין טקסט להעתקה"); return; }
                try {
                    const temp = document.createElement('textarea');
                    temp.value = text;
                    document.body.appendChild(temp);
                    temp.select();
                    document.execCommand('copy');
                    document.body.removeChild(temp);
                    showToast("הטקסט הועתק ללוח!");
                } catch (e) { showToast("שגיאה בהעתקה"); }
            };

            document.getElementById('btn-new').onclick = () => {
                if (isRunning) { showToast("עצור את ההקלטה תחילה"); return; }
                if (output.value.trim()) saveCurrentToHistory(true);
                output.value = '';
                localStorage.removeItem('nesiya_draft');
                localStorage.removeItem('nesiya_current_id');
                showToast("שיחה חדשה התחילה");
            };

            const btn = document.getElementById('record-btn');
            const recordIcon = document.getElementById('record-icon');
            const recordText = document.getElementById('record-text');
            const outputEl = document.getElementById('output');
            let isRunning = false;
            let wakeLock = null;

            async function startLoop() {
                if (!getApiKey()) { showToast("מפתח API חסר"); return; }
                isRunning = true;
                recordText.textContent = "עצור הקלטה";
                recordIcon.className = "w-3 h-3 rounded-full bg-white animate-ping";
                btn.className = "w-full py-6 bg-red-600 active:scale-[0.98] transition-all rounded-2xl font-bold text-xl shadow-lg shadow-red-900/20 flex items-center justify-center gap-2";
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    log("נעילת מסך פעילה.");
                } catch (err) { log("WakeLock לא נתמך."); }

                while (isRunning) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        const mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                        let chunks = [];
                        mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
                        mediaRecorder.start();
                        log("הקלטת מקטע החלה...");
                        status.textContent = "מקליט...";
                        await new Promise((resolve) => {
                            const timeout = setTimeout(resolve, 20000);
                            const checker = setInterval(() => {
                                if (!isRunning) { clearTimeout(timeout); clearInterval(checker); resolve(); }
                            }, 200);
                        });
                        mediaRecorder.stop();
                        stream.getTracks().forEach(t => t.stop());
                        await new Promise(r => mediaRecorder.onstop = r);
                        if (chunks.length > 0) sendToWhisper(new Blob(chunks, { type: 'audio/webm' }));
                    } catch (e) {
                        log("שגיאת הקלטה: " + e.message);
                        stopRecording();
                    }
                }
            }

            function stopRecording() {
                isRunning = false;
                if (wakeLock) wakeLock.release().then(() => wakeLock = null);
                recordText.textContent = "התחל הקלטה";
                recordIcon.className = "w-3 h-3 rounded-full bg-white";
                btn.className = "w-full py-6 bg-blue-600 active:scale-[0.98] transition-all rounded-2xl font-bold text-xl shadow-lg shadow-blue-900/20 flex items-center justify-center gap-2";
                status.textContent = "מוכן";
                log("ההקלטה נעצרה.");
                saveCurrentToHistory(true);
            }

            async function sendToWhisper(blob) {
                log(`שולח קובץ שמע (${(blob.size / 1024).toFixed(1)} KB)...`);
                const formData = new FormData();
                formData.append('file', blob, 'audio.webm');
                formData.append('model', 'whisper-1');
                try {
                    const res = await fetch('https://api.openai.com/v1/audio/transcriptions', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${getApiKey()}` },
                        body: formData
                    });
                    const data = await res.json();
                    if (data.text) {
                        log("תמלול התקבל.");
                        outputEl.value += (outputEl.value ? " " : "") + data.text;
                        localStorage.setItem('nesiya_draft', outputEl.value);
                        saveCurrentToHistory(true);
                    } else if (data.error) {
                        log("שגיאת API: " + data.error.message);
                    }
                } catch (e) {
                    log("שגיאת רשת: " + e.message);
                }
            }

            btn.onclick = () => { if (isRunning) stopRecording(); else startLoop(); };
        };
    </script>
</body>
</html>
